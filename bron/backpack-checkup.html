<style>
  :root {
    --sand: #FAF7F2;
    --sand-dark: #EDE4D6;
    --green-deep: #24433A;
    --green-mid: #5F6D66;
    --green-light: #7C9A8B;
    --green-pale: #DCE5DE;
    --terracotta: #B5794F;
    --text-dark: #24433A;
    --text-mid: #5F6D66;
    --text-light: #7C9A8B;
    --white: #FAF7F2;
    --border: rgba(36,67,58,0.12);
    --border-strong: rgba(36,67,58,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button, textarea, input { font-family: inherit; }
  body {
    font-family: 'Work Sans', sans-serif;
    background: #EDE4D6;
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: #FAF7F2;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .progress-bar { height: 3px; background: var(--sand-dark); }
  .progress-fill { height: 100%; background: var(--green-deep); transition: width 0.5s ease; }
  .header {
    padding: 16px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 21px;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--green-deep);
  }
  .logo-mark {
    height: 34px;
    width: 51px;
    flex-shrink: 0;
    display: block;
    fill: #495a58;
  }
  .silhouette-wrap path { fill: #5F6D66; }
  .screen-footer {
    width: 100%;
    margin-top: auto;
    padding-top: 20px;
    padding-bottom: 0;
    flex-shrink: 0;
    overflow: visible;
    line-height: 0;
  }
  .silhouette-wrap {
    width: 100%;
    line-height: 0;
  }
  .silhouette-wrap svg {
    width: 100%;
    height: auto;
    display: block;
    opacity: 0.22;
    margin-bottom: -4px;
  }
  .step-indicator { font-size: 12px; color: var(--text-light); font-weight: 300; }
  .screen {
    flex: 1;
    padding: 28px 24px 16px;
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.35s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .tag-line {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--terracotta);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .welcome-title {
    font-family: 'Work Sans', sans-serif;
    font-size: 38px;
    font-weight: 300;
    line-height: 1.1;
    color: var(--green-deep);
    margin-bottom: 18px;
  }
  .welcome-intro {
    font-size: 15px;
    font-weight: 300;
    line-height: 1.75;
    color: var(--text-mid);
    margin-bottom: 28px;
  }

  .ijsberg-intro {
    font-size: 14px;
    font-weight: 300;
    line-height: 1.7;
    color: var(--green-deep);
    background: var(--green-pale);
    border-radius: 10px;
    padding: 13px 15px;
    margin-bottom: 14px;
    opacity: 0.9;
  }
  .ijsberg-block {
    background: var(--sand);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    margin-bottom: 28px;
  }
  .ijsberg-title {
    padding: 13px 16px 10px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--green-mid);
    text-transform: uppercase;
  }
  .ij-layer {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  .ij-layer.underwater { background: rgba(58,82,68,0.06); }
  .ij-num {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--green-deep);
    color: white;
    font-size: 11px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .ij-layer.underwater .ij-num { background: var(--green-mid); }
  .ij-content strong {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dark);
    margin-bottom: 2px;
  }
  .ij-content span {
    font-size: 12px;
    font-weight: 300;
    color: var(--text-mid);
    line-height: 1.5;
  }
  .underwater-label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    background: rgba(58,82,68,0.03);
  }
  .underwater-line { flex: 1; height: 1px; background: var(--border-strong); }
  .underwater-text { font-size: 10px; letter-spacing: 0.1em; color: var(--text-light); text-transform: uppercase; white-space: nowrap; }
  .time-note {
    font-size: 12px;
    color: var(--text-light);
    text-align: center;
    margin-bottom: 20px;
  }
  .time-note span { color: var(--green-mid); }
  .btn-start {
    width: 100%;
    padding: 16px;
    background: var(--green-deep);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-start:hover { opacity: 0.88; }
  .question-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--terracotta);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .question-text {
    font-family: 'Work Sans', sans-serif;
    font-size: 26px;
    font-weight: 300;
    line-height: 1.3;
    color: var(--green-deep);
    margin-bottom: 8px;
  }
  .question-sub {
    font-size: 14px;
    font-weight: 300;
    color: var(--text-mid);
    line-height: 1.65;
    margin-bottom: 24px;
  }
  .options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 16px; }
  .option {
    padding: 13px 16px;
    border: 1.5px solid var(--border-strong);
    border-radius: 12px;
    background: var(--white);
    cursor: pointer;
    transition: all 0.18s ease;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-dark);
    text-align: left;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
  }
  .option:hover { border-color: var(--green-mid); background: var(--green-pale); }
  .option.selected { border-color: var(--green-deep); background: var(--green-pale); color: var(--green-deep); font-weight: 500; }
  .checkbox {
    width: 17px;
    height: 17px;
    border-radius: 4px;
    border: 1.5px solid var(--border-strong);
    margin-right: 11px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: transparent;
    transition: all 0.18s;
    line-height: 1;
  }
  .option.selected .checkbox { background: var(--green-deep); border-color: var(--green-deep); color: white; }
  .open-input {
    width: 100%;
    border: 1.5px solid var(--border-strong);
    border-radius: 12px;
    padding: 14px 16px;
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--text-dark);
    background: var(--white);
    resize: none;
    outline: none;
    line-height: 1.6;
    transition: border-color 0.2s;
  }
  .open-input::placeholder { color: var(--text-light); }
  .open-input:focus { border-color: var(--green-mid); }
  .slider-row { display: flex; flex-direction: column; gap: 22px; margin-bottom: 16px; }
  .slider-item { display: flex; flex-direction: column; gap: 12px; }
  .slider-label { font-size: 13px; font-weight: 400; color: var(--text-dark); display: flex; justify-content: space-between; }
  .slider-label span { color: var(--green-deep); font-weight: 500; }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--sand-dark);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: #24433A;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #FAF7F2;
    box-shadow: 0 0 0 1.5px #24433A;
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    background: #24433A;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #FAF7F2;
    box-shadow: 0 0 0 1.5px #24433A;
  }
  .slider-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-light); }
  .nav { padding: 8px 24px 36px; display: flex; gap: 10px; }
  .btn-back {
    padding: 14px 18px;
    background: transparent;
    border: 1.5px solid var(--border-strong);
    border-radius: 10px;
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-back:hover { border-color: var(--green-mid); color: var(--green-deep); }
  .btn-next {
    flex: 1;
    padding: 14px;
    background: var(--green-deep);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.18s;
  }
  .btn-next:hover { opacity: 0.88; }
  .btn-next:disabled { opacity: 0.32; cursor: not-allowed; }
  .result-header {
    text-align: center;
    padding: 8px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .result-tag { font-size: 11px; letter-spacing: 0.12em; color: var(--terracotta); text-transform: uppercase; font-weight: 500; margin-bottom: 10px; }
  .result-title { font-family: 'Work Sans', sans-serif; font-size: 32px; font-weight: 300; color: var(--green-deep); line-height: 1.2; }
  .reflection-intro {
    font-size: 14px;
    font-weight: 300;
    color: var(--text-mid);
    line-height: 1.7;
    margin-bottom: 28px;
    font-style: italic;
  }
  .question-card {
    border-left: 3px solid var(--green-mid);
    padding: 14px 16px;
    margin-bottom: 16px;
    background: var(--sand);
    border-radius: 0 10px 10px 0;
  }
  .question-number {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--green-mid);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .question-card p {
    font-family: 'Work Sans', sans-serif;
    font-size: 20px;
    font-weight: 400;
    line-height: 1.4;
    color: var(--green-deep);
    margin: 0;
  }
  .layer-result-sublabel {
    font-size: 10px;
    font-weight: 400;
    color: var(--text-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .layer-clementine-badge {
    font-size: 10px;
    font-weight: 500;
    color: var(--green-deep);
    background: var(--green-pale);
    border-radius: 20px;
    padding: 2px 8px;
    letter-spacing: 0.04em;
  }
  .layer-result-card {
    border-left: 3px solid var(--green-mid);
    padding: 12px 14px;
    margin-bottom: 12px;
    background: var(--sand);
    border-radius: 0 10px 10px 0;
  }
  .layer-result-num {
    display: inline-block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: white;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 5px;
    background: var(--green-mid);
  }
  .layer-result-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--green-deep);
    margin-bottom: 4px;
  }
  .layer-result-text {
    font-size: 13px;
    font-weight: 300;
    color: var(--text-mid);
    line-height: 1.65;
  }
  .reflection-text { font-size: 15px; font-weight: 300; line-height: 1.85; color: var(--text-dark); margin-bottom: 16px; }
  .reflection-heading {
    font-family: 'Work Sans', sans-serif;
    font-size: 19px;
    font-weight: 400;
    color: var(--green-deep);
    margin: 24px 0 8px;
    line-height: 1.3;
  }
  .reflection-heading:first-child { margin-top: 0; }
  .reflection-loading {
    display: flex; flex-direction: column; align-items: center;
    gap: 20px; padding: 48px 0; text-align: center;
  }
  .reflection-loading p { font-size: 14px; color: var(--text-mid); font-weight: 300; line-height: 1.7; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 8px; height: 8px; background: var(--green-deep); border-radius: 50%; animation: pulse 1.2s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,80%,100% { transform:scale(0.65); opacity:0.35; } 40% { transform:scale(1); opacity:1; } }
  .cursor-blink { display:inline-block; width:2px; height:1em; background:var(--green-deep); margin-left:2px; vertical-align:-2px; animation:blink 0.8s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .cta-block {
    margin-top: 32px;
    margin-bottom: 48px;
    padding: 20px 18px 18px;
    background: #24433A;
    border-radius: 16px;
    text-align: left;
  }
  .cta-tagline {
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    font-weight: 300;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0;
    text-align: center;
    margin-top: 20px;
    margin-bottom: 0;
    line-height: 1.2;
  }
  .cta-name { font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green-pale); margin-bottom: 12px; margin-top: 4px; }
  .cta-title { font-family: 'Work Sans', sans-serif; font-size: 21px; font-weight: 300; line-height: 1.3; color: white; margin-bottom: 8px; }
  .cta-block p { font-size: 14px; font-weight: 300; color: rgba(255,255,255,0.82); line-height: 1.7; margin-bottom: 14px; }
  .cta-no-wrong { font-style: italic; color: rgba(255,255,255,0.65) !important; font-size: 13px !important; margin-bottom: 18px !important; }
  .klacht-block {
    font-size: 14px;
    font-weight: 300;
    line-height: 1.7;
    color: var(--text-dark);
    background: #F5EDE3;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .klacht-block em { font-style: italic; color: var(--green-deep); font-weight: 400; }
  .btn-primary {
    display: block; width: 100%; padding: 15px;
    background: white; color: var(--green-deep);
    border: none; border-radius: 10px;
    font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 500;
    cursor: pointer; text-decoration: none; text-align: center;
    transition: opacity 0.2s; margin-bottom: 10px;
  }
  .btn-primary:hover { opacity: 0.9; }

  .pdf-row { margin: 18px 0 4px; }
  .btn-pdf {
    display: block; width: 100%; padding: 13px;
    background: transparent; color: var(--green-deep);
    border: 1.5px solid var(--green-deep); border-radius: 10px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .btn-pdf:hover { background: var(--green-deep); color: white; }
  .print-footer { display: none; }
  .waterlijn { display: none; }

  @media print {
    @page { size: A4; margin: 14mm 16mm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { background: #fff !important; min-height: 0; display: block; color: #25302C; }
    .app { max-width: 150mm; min-height: 0; margin: 0 auto; background: #fff; display: block; }
    .site-terug, .progress-bar, .nav, .pdf-row, .zelf-card, #cta-block, .step-indicator { display: none !important; }
    /* het silhouet blijft in de DOM (het logo hergebruikt het), maar wordt niet getoond */
    .screen-footer { position: absolute; width: 0; height: 0; overflow: hidden; padding: 0; margin: 0; }
    #reflection-output { opacity: 1 !important; }

    /* huisstijl: bosgroen, salie en gedempt; geen terracotta; Light, Medium alleen voor kapitaallabels */
    .result-header { padding: 0 0 10px; margin-bottom: 10px; border-bottom: 1px solid #E3DED6; }
    .result-tag { color: #5F6D66; font-size: 10pt; font-weight: 500; letter-spacing: 0.12em; }
    .result-title { font-size: 22pt; font-weight: 300; color: #24433A; letter-spacing: -0.01em; }
    .reflection-intro { font-size: 10.5pt; font-weight: 300; font-style: normal; color: #5F6D66; line-height: 1.5; margin-bottom: 10px; }

    .layer-result-card {
      background: transparent !important;
      border: 2.5px solid var(--kc, #5F6D66);
      border-radius: 7mm;
      padding: 9px 18px;
      margin-bottom: 8px !important;
      break-inside: avoid; page-break-inside: avoid;
    }
    .layer-result-num {
      background: transparent !important;
      color: #24433A !important;
      border: 1px solid var(--kc, #5F6D66);
      font-size: 9pt; font-weight: 500; letter-spacing: 0.1em;
    }
    .layer-result-label { font-size: 12pt; font-weight: 500; color: #24433A; }
    .layer-result-sublabel { font-size: 9pt; font-weight: 500; letter-spacing: 0.1em; color: #5F6D66; }
    .layer-result-text { font-size: 10.5pt; font-weight: 300; color: #25302C; line-height: 1.45; }
    .waterlijn { display: block; border-top: 2px dotted #5F6D66; margin: 2px 4px 10px; }
    .layer-result-text span { border-bottom-color: #E3DED6 !important; }

    .print-footer {
      display: block; margin-top: 8px; padding-top: 6px;
      border-top: 1px solid #E3DED6;
      font-size: 10pt; font-weight: 300; color: #5F6D66;
      text-align: center; letter-spacing: 0.04em;
      break-inside: avoid;
    }
  }

  .zelf-card {
    background: var(--green-pale);
    border-radius: 14px;
    padding: 20px 18px 18px;
    margin: 20px 0 4px;
  }
  .zelf-label { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green-mid); margin-bottom: 8px; }
  .zelf-title { font-size: 21px; font-weight: 300; line-height: 1.3; color: var(--green-deep); margin-bottom: 8px; }
  .zelf-text { font-size: 14px; font-weight: 300; line-height: 1.7; color: var(--text-dark); margin-bottom: 16px; }
  .btn-zelf {
    display: block; width: 100%; padding: 13px;
    background: transparent; color: var(--green-deep);
    border: 1.5px solid var(--green-deep); border-radius: 10px;
    font-size: 14px; font-weight: 500;
    text-decoration: none; text-align: center;
    transition: background 0.2s, color 0.2s;
  }
  .btn-zelf:hover { background: var(--green-deep); color: white; }

  .site-terug {
    width: 100%; max-width: 480px; padding: 16px 26px 12px;
    font-family: 'Work Sans', sans-serif; font-size: 13px; font-weight: 400;
    color: #5F6D66; text-decoration: none; display: flex; align-items: center; gap: 8px;
    transition: color .2s;
  }
  .site-terug:hover { color: #24433A; }
</style>

<script>
const answers = {};
let currentStep = 0;

const STEPS = [
  { id: 'welcome', type: 'welcome' },
  { id: 'naam', type: 'open', label: 'Even kennismaken', question: 'Hoe mag ik je noemen?', placeholder: 'Je voornaam…', rows: 1, required: true, enterNext: true },
  { id: 'hoe_voel', type: 'multi', label: 'Het topje van de ijsberg', question: 'Wat brengt jou hier?', sub: 'Kies alles wat herkenbaar is. Er zijn geen verkeerde antwoorden.', options: ['Lichamelijke klachten die maar niet overgaan', 'Aanhoudende vermoeidheid - weinig energie', 'Slaapproblemen - niet uitgerust wakker worden', 'Veel stress, altijd AAN staan, druk hoofd of een gevoel van spanning', 'Somberheid, angst of innerlijke onrust', 'Beperkende gedachten over mezelf of de wereld om me heen', 'Moeite met voelen in mijn lijf', 'Leefstijlvragen - ik wil gezonder leven', 'Moeite met verbinding - met mezelf of anderen', 'Twijfel over mijn richting of levensvragen', 'Anders, niet hierboven vermeld'] },
  { id: 'hoe_voel_anders', type: 'ja_nee_open', label: 'Wat brengt jou hier - in je eigen woorden', question: 'Is er nog iets anders dat speelt?', placeholder: 'In je eigen woorden…', rows: 3 },
  { id: 'al_bezig', type: 'multi', label: 'Wat heb je al geprobeerd?', question: 'Wat doe je al, of wat heb je al geprobeerd?', sub: 'Wat herken jij?', options: ['Arts, psycholoog, therapeut of specialist raadplegen', 'Medicijnen, supplementen of andere behandelingen', 'Letten op voeding of beweging', 'Werken aan ontspanning of slaap', 'Aandacht voor zingeving of betekenis', 'Coaching of persoonlijke ontwikkeling', 'Van alles geprobeerd, maar niets houdt duurzaam stand of heeft voldoende blijvend effect', 'Ik weet niet goed waar ik moet beginnen'] },
  { id: 'lichaam', type: 'slider', label: 'Je lichaam als kompas', question: 'Hoe gaat het op dit moment?', sub: 'Schuif eerlijk - niet zoals je zou willen, maar zoals het nu is.', sliders: [{ key: 'voeding', label: 'Voeding', left: 'Ongezond & snel', right: 'Gezond & bewust' }, { key: 'beweging', label: 'Beweging', left: 'Nauwelijks', right: 'Regelmatig' }, { key: 'energie', label: 'Energie', left: 'Uitgeput', right: 'Vitaal' }, { key: 'slaap', label: 'Slaap', left: 'Slecht', right: 'Goed' }, { key: 'stress', label: 'Stress & ontspanning', left: 'Veel stress', right: 'Ontspannen' }, { key: 'verbinding', label: 'Verbinding met jezelf (je lichaam, je essentie)', left: 'Onvoldoende, zoekende', right: 'Goed, verbonden' }, { key: 'verbinding_anderen', label: 'Verbinding met anderen', left: 'Onvoldoende, zoekende', right: 'Goed, verbonden' }, { key: 'zingeving', label: 'Zingeving', left: 'Zoekend', right: 'Vervuld' }] },
  { id: 'patronen', type: 'single', label: 'Dieper kijken', question: 'Heb je het gevoel dat bepaalde patronen en thema\'s zich steeds herhalen?', sub: 'Denk aan terugkerende patronen en thema\'s in je gedrag, emoties, gedachten, gezondheid, relaties en werk - situaties of gevoelens die steeds weer opduiken.', options: ['Ja, heel herkenbaar - ik loop steeds tegen hetzelfde aan', 'Soms wel, maar ik zie het verband niet altijd', 'Misschien - ik heb er nog niet echt bij stilgestaan', 'Ik heb geen idee, maar wil het wel verkennen', 'Niet echt, dit herken ik niet zo'] },
  { id: 'patronen_open', type: 'open', label: 'Het patroon in woorden', question: "Kun je één zo'n patroon omschrijven?", placeholder: 'Neem je tijd - er is geen goed of fout antwoord…', rows: 4, required: false, enterNext: true, condition: (a) => a.patronen && ['Ja, heel herkenbaar - ik loop steeds tegen hetzelfde aan','Soms wel, maar ik zie het verband niet altijd'].includes(a.patronen) },
  { id: 'familie', type: 'single', label: 'Jouw backpack', question: 'Kijk je weleens naar ervaringen uit het verleden als mogelijke bron van wat je nu ervaart?', sub: 'Van jezelf, je ouders of eerdere generaties - soms reist er meer mee dan we beseffen.', options: ['Ja, ik zie daar duidelijke verbanden', 'Ik vermoed het wel, maar het is onduidelijk', 'Ik wil er wel naar kijken, maar het voelt spannend', 'Ik heb geen idee, maar wil het wel onderzoeken', 'Nee, ik denk niet dat dit hier een rol speelt'] },
  { id: 'behoefte', type: 'multi', label: 'Wat heb jij nodig?', question: 'Waar heb jij nu het meeste behoefte aan?', sub: 'Kies alles wat resoneert. Laat je intuïtie antwoorden, niet je hoofd.', options: ['Iemand die echt luistert, zonder oordeel', 'Gewoon weten waar ik moet beginnen', 'Concrete handvatten en praktische tips', 'Rust en een stap terug kunnen zetten', 'De kern zien - begrijpen wat er écht speelt', 'Meer ruimte om te voelen', 'Begeleiding om patronen te doorbreken', 'Inzicht krijgen in mijn familiesysteem', 'Verwerken van onverwerkte ervaringen'] },
  { id: 'droom', type: 'open', label: 'Jouw stip op de horizon', question: 'Als het lukt - wat verandert er dan in jouw leven?', placeholder: 'Beschrijf het beeld dat opkomt…', rows: 4, required: false, enterNext: true },
  { id: 'reflection', type: 'reflection' }
];

function getActiveSteps() {
  return STEPS.filter(s => !s.condition || s.condition(answers));
}

function updateProgress() {
  const steps = getActiveSteps();
  const pct = currentStep === 0 ? 0 : Math.round((currentStep / (steps.length - 1)) * 100);
  document.getElementById('progress').style.width = pct + '%';
  if (currentStep > 0 && currentStep < steps.length - 1) {
    document.getElementById('step-indicator').textContent = currentStep + ' / ' + (steps.length - 2);
  } else {
    document.getElementById('step-indicator').textContent = '';
  }
}

function render() {
  const steps = getActiveSteps();
  const step = steps[currentStep];
  const container = document.getElementById('screen-container');
  container.innerHTML = '';
  updateProgress();

  const screen = document.createElement('div');
  screen.className = 'screen';

  if (step.type === 'welcome') {
    screen.innerHTML = `
      <div class="tag-line">Een uitnodiging van Backpack</div>
      <div class="welcome-title">Wat draag jij met je mee?</div>
      <p class="welcome-intro">Ieder mens draagt een rugzak met talenten, kwaliteiten en ervaringen. Soms voel je hem nauwelijks. Soms voelt hij zwaar.<br><br>Bij Backpack geloven we dat chronische klachten zelden op zichzelf staan. Onder wat je ziet en voelt, liggen vaak diepere lagen. Deze check-up helpt je te verbinden hiermee.</p>
      <p class="ijsberg-intro">Denk aan een ijsberg. Wat je ziet en voelt - je klachten, je vermoeidheid, je spanning - is het topje. Maar onder de oppervlakte ligt vaak veel meer.</p>
<div class="ijsberg-block">
        <div class="ijsberg-title">Drie lagen waarop je kunt werken</div>
        <div class="ij-layer"><div class="ij-num">1</div><div class="ij-content"><strong>Symptoomverlichting & behandeling</strong><span>Klachten verlichten via medicijnen, therapie of andere behandelingen.</span></div></div>
        <div class="ij-layer"><div class="ij-num">2</div><div class="ij-content"><strong>Leefstijl & zelfzorg</strong><span>Een gezonde basis bouwen met aandacht voor: voeding, beweging, slaap, ontspanning, verbinding en zingeving.</span></div></div>
        <div class="underwater-label"><div class="underwater-line"></div><div class="underwater-text">onder de oppervlakte</div><div class="underwater-line"></div></div>
        <div class="ij-layer underwater"><div class="ij-num">3</div><div class="ij-content"><strong>Jouw Backpack: bewustwording en verwerking</strong><span>Inzicht krijgen in jouw familiesysteem, de thema's en patronen. Indien gewenst, de onverwerkte ervaringen verwerken die je - vaak onbewust - met je meedraagt.</span></div></div>
      </div>
      <p class="time-note">Duurt <span>± 2 minuten</span> · Geen verkeerde antwoorden</p>
      <p style="font-size:12px;color:var(--text-light);text-align:center;margin-bottom:16px;line-height:1.6;">🔒 Er worden geen gegevens verzameld of opgeslagen.<br>Jouw antwoorden zijn alleen voor jou.</p>
      <button class="btn-start" onclick="nextStep()">Begin de check-up →</button>
    `;
  } else if (step.type === 'open') {
    const val = answers[step.id] || '';
    screen.innerHTML = `
      <div class="question-label">${step.label}</div>
      <div class="question-text">${step.question}</div>
      ${step.sub ? `<div class="question-sub">${step.sub}</div>` : ''}
      <textarea class="open-input" id="input-${step.id}" placeholder="${step.placeholder}" rows="${step.rows}" style="min-height:${step.rows*28+32}px">${val}</textarea>
    `;
  } else if (step.type === 'single') {
    const val = answers[step.id] || '';
    screen.innerHTML = `
      <div class="question-label">${step.label}</div>
      <div class="question-text">${step.question}</div>
      ${step.sub ? `<div class="question-sub">${step.sub}</div>` : ''}
      <div class="options">${step.options.map(o => `<button class="option${val===o?' selected':''}" onclick="selectSingle('${step.id}','${o.replace(/'/g,"\\'")}',this)">${o}</button>`).join('')}</div>
    `;
  } else if (step.type === 'multi') {
    const vals = answers[step.id] || [];
    screen.innerHTML = `
      <div class="question-label">${step.label}</div>
      <div class="question-text">${step.question}</div>
      ${step.sub ? `<div class="question-sub">${step.sub}</div>` : ''}
      <div class="options">${step.options.map(o => `<button class="option${vals.includes(o)?' selected':''}" onclick="toggleMulti('${step.id}','${o.replace(/'/g,"\\'")}',this)"><span class="checkbox">${vals.includes(o)?'✓':''}</span>${o}</button>`).join('')}</div>
    `;
  } else if (step.type === 'slider') {
    screen.innerHTML = `
      <div class="question-label">${step.label}</div>
      <div class="question-text">${step.question}</div>
      <div class="question-sub">${step.sub}</div>
      <div class="slider-row">${step.sliders.map(s => {
        const val = answers[s.key] !== undefined ? answers[s.key] : 5;
        return `<div class="slider-item"><div class="slider-label">${s.label} <span id="val-${s.key}">${val}</span></div>${s.sublabel ? `<div style="font-size:11px;color:var(--text-light);margin-bottom:4px;">${s.sublabel}</div>` : ''}<input type="range" min="1" max="10" step="1" value="${val}" oninput="updateSlider('${s.key}',this.value)"><div class="slider-ends"><span>${s.left}</span><span>${s.right}</span></div></div>`;
      }).join('')}</div>
    `;
  } else if (step.type === 'ja_nee_open') {
    const jaSelected = answers[step.id + '_ja'] === true;
    const tekstVal = answers[step.id] || '';
    screen.innerHTML = `
      <div class="question-label">${step.label}</div>
      <div class="question-text">${step.question}</div>
      <div class="options" style="flex-direction:row;gap:10px;margin-bottom:16px;">
        <button class="option${!jaSelected && answers[step.id + '_ja'] !== undefined ? ' selected' : ''}" style="flex:1;justify-content:center;" onclick="selectJaNee('${step.id}', false, this)">Nee</button>
        <button class="option${jaSelected ? ' selected' : ''}" style="flex:1;justify-content:center;" onclick="selectJaNee('${step.id}', true, this)">Ja</button>
      </div>
      <div id="ja-tekstvak" style="display:${jaSelected ? 'block' : 'none'}">
        <textarea class="open-input" id="input-${step.id}" placeholder="${step.placeholder}" rows="${step.rows}" style="min-height:${step.rows*28+32}px">${tekstVal}</textarea>
      </div>
    `;
  } else if (step.type === 'reflection') {
    screen.innerHTML = `
      <div class="result-header">
        <div class="result-tag">Jouw persoonlijke reflectie</div>
        <div class="result-title">Waar jij<br>aan kunt werken</div>
      </div>
      <p class="reflection-intro">Hieronder zie je - op basis van wat jij deelde - de klacht of het thema waar jij graag verandering in ziet met de bijbehorende lagen die relevant voor jou lijken.</p>
      <div id="reflection-output"></div>
      <div class="print-footer">Unpack your story &middot; mybackpack.nl</div>
      <div id="cta-block" style="display:none">
        <div class="cta-block">
          <div class="cta-name">Samen aan de slag</div>
          <div class="cta-title">Jij hoeft het niet alleen te doen</div>
          <p id="cta-personal-text"></p>
          <a href="https://backpack.clientomgeving.nl/afspraak-maken" class="btn-primary" target="_blank">Plan gratis kennismaking →</a>
          <div class="cta-tagline">Let's unpack your story</div>
        </div>
      </div>
    `;
    container.appendChild(screen);
    // Terugknop op eindscherm
    const navBack = document.createElement('div');
    navBack.className = 'nav';
    navBack.innerHTML = `<button class="btn-back" onclick="prevStep()">←</button>`;
    container.appendChild(navBack);
    generateReflection();
    return;
  }

  if (!['welcome','reflection'].includes(step.type)) {
    const nav = document.createElement('div');
    nav.className = 'nav';
    if (currentStep > 1) nav.innerHTML += `<button class="btn-back" onclick="prevStep()">←</button>`;
    const isRequired = step.required !== false;
    const hasAnswer = step.type === 'slider' ? true
      : step.type === 'multi' ? (answers[step.id] && answers[step.id].length > 0)
      : step.type === 'ja_nee_open' ? (answers[step.id + '_ja'] !== undefined)
      : !!answers[step.id];
    nav.innerHTML += `<button class="btn-next" id="btn-next" onclick="nextStep()" ${isRequired && !hasAnswer ? 'disabled' : ''}>Verder →</button>`;
    container.appendChild(screen);
    container.appendChild(nav);

    if (step.type === 'open') {
      const ta = screen.querySelector('textarea');
      ta.addEventListener('input', () => {
        answers[step.id] = ta.value.trim();
        const btn = document.getElementById('btn-next');
        if (btn) btn.disabled = (step.required !== false) && !ta.value.trim();
      });
      if (step.enterNext) {
        ta.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); answers[step.id] = ta.value.trim(); if (ta.value.trim()) nextStep(); }
        });
      }
      setTimeout(() => ta.focus(), 60);
    }
    if (step.type === 'ja_nee_open') {
      const ta = screen.querySelector('textarea');
      if (ta) {
        ta.addEventListener('input', () => { answers[step.id] = ta.value.trim(); });
        ta.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); answers[step.id] = ta.value.trim(); nextStep(); }
        });
      }
    }
    return;
  }
  container.appendChild(screen);
}

function selectJaNee(id, isJa, el) {
  answers[id + '_ja'] = isJa;
  if (!isJa) { answers[id] = ''; }
  // update button styles
  el.closest('.options').querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  // show/hide tekstvak
  const vak = document.getElementById('ja-tekstvak');
  if (vak) vak.style.display = isJa ? 'block' : 'none';
  if (isJa) {
    setTimeout(() => { const ta = document.getElementById('input-' + id); if (ta) ta.focus(); }, 60);
    // verplicht toelichting bij Ja
    const btn = document.getElementById('btn-next');
    if (btn) btn.disabled = true;
    // luister naar tekst invoer
    const ta = document.getElementById('input-' + id);
    if (ta) {
      ta.addEventListener('input', () => {
        answers[id] = ta.value.trim();
        const b = document.getElementById('btn-next');
        if (b) b.disabled = !ta.value.trim();
      });
    }
  } else {
    const btn = document.getElementById('btn-next');
    if (btn) btn.disabled = false;
  }
}

function selectSingle(id, val, el) {
  answers[id] = val;
  el.closest('.options').querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  const btn = document.getElementById('btn-next');
  if (btn) btn.disabled = false;
  setTimeout(() => nextStep(), 300);
}

function toggleMulti(id, val, el) {
  if (!answers[id]) answers[id] = [];
  const idx = answers[id].indexOf(val);
  const cb = el.querySelector('.checkbox');
  if (idx > -1) { answers[id].splice(idx,1); el.classList.remove('selected'); if(cb) cb.textContent=''; }
  else { answers[id].push(val); el.classList.add('selected'); if(cb) cb.textContent='✓'; }
  const btn = document.getElementById('btn-next');
  if (btn) btn.disabled = answers[id].length === 0;
}

function updateSlider(key, val) {
  answers[key] = parseInt(val);
  const el = document.getElementById('val-'+key);
  if (el) el.textContent = val;
}

function nextStep() {
  const steps = getActiveSteps();
  const step = steps[currentStep];
  if (step.type === 'open') { const ta = document.getElementById('input-'+step.id); if(ta) answers[step.id]=ta.value.trim(); }
  if (step.type === 'ja_nee_open') { const ta = document.getElementById('input-'+step.id); if(ta) answers[step.id]=ta.value.trim(); }
  if (step.type === 'slider') { step.sliders.forEach(s => { const el = document.querySelector(`input[oninput*="${s.key}"]`); if(el) answers[s.key]=parseInt(el.value); }); }
  if (currentStep < steps.length - 1) { currentStep++; window.scrollTo(0,0); render(); }
}

function prevStep() {
  if (currentStep > 0) { currentStep--; window.scrollTo(0,0); render(); }
}

function bewaarAlsPDF() {
  const origineel = document.title;
  const naam = (typeof answers !== 'undefined' && answers.naam) ? String(answers.naam).trim() : '';
  document.title = 'Backpack check-up' + (naam ? ' - ' + naam.replace(/[\\\/:*?"<>|]+/g, '') : '');
  const herstel = () => { document.title = origineel; window.removeEventListener('afterprint', herstel); };
  window.addEventListener('afterprint', herstel);
  window.print();
}

function generateReflection() {
  const klachten      = answers.hoe_voel || [];
  const klachtenAnders = (answers.hoe_voel_anders || '').trim();
  const albezig       = answers.al_bezig || [];
  const patronen      = answers.patronen || '';           // slide 6
  const patronenOpen  = (answers.patronen_open || '').trim(); // slide 7
  const familie       = answers.familie || '';             // slide 8
  const behoefte      = answers.behoefte || [];            // slide 9
  const droom         = (answers.droom || '').trim();      // slide 10

  const energie         = answers.energie           !== undefined ? answers.energie           : 5;
  const slaap           = answers.slaap             !== undefined ? answers.slaap             : 5;
  const stress          = answers.stress            !== undefined ? answers.stress            : 5;
  const verbinding      = answers.verbinding        !== undefined ? answers.verbinding        : 5;
  const verbinding_anderen = answers.verbinding_anderen !== undefined ? answers.verbinding_anderen : 5;
  const voeding         = answers.voeding           !== undefined ? answers.voeding           : 5;
  const beweging        = answers.beweging          !== undefined ? answers.beweging          : 5;
  const zingeving       = answers.zingeving         !== undefined ? answers.zingeving         : 5;

  function joinNl(arr) {
    if (arr.length === 0) return '';
    if (arr.length === 1) return arr[0];
    return arr.slice(0, -1).join(', ') + ' en ' + arr[arr.length - 1];
  }

  // ── Klacht-blok: slide 2 (multi) + slide 3 (open, alleen echte tekst) ────
  // Slide 3 alleen tonen als Ja is geklikt én er tekst is
  const andersJa = answers['hoe_voel_anders_ja'] === true;
  const andersIsZinvol = andersJa && klachtenAnders.length > 2;
  const klachtItems = [...klachten.filter(k => k !== 'Anders, niet hierboven vermeld'), ...(andersIsZinvol ? [klachtenAnders] : [])];

  let klachtHTML = '';
  if (klachtItems.length > 0) {
    klachtHTML = `
      <div class="layer-result-card" style="border-left-color:#DCD9D0; --kc:#DCD9D0; margin-bottom:20px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <div class="layer-result-num" style="background:#DCD9D0; color:#24433A">Jouw klacht</div>
        </div>
        <div class="layer-result-sublabel">topje van de ijsberg - waar jij verandering in wilt zien</div>
        <div class="layer-result-text" style="margin-top:6px;">${klachtItems.map(i => `<span style="display:block;padding:3px 0;border-bottom:1px solid rgba(36,67,58,0.08)">→ ${i}</span>`).join('')}</div>
      </div>`;
  }

  // ── Laag 1: symptomen verlichten & behandelen ────────────────────────────
  const behandelingAl = albezig.filter(a =>
    a.includes('Arts') || a.includes('Medicijnen') || a.includes('specialist') ||
    a.includes('psycholoog') || a.includes('therapeut') || a.includes('behandeling')
  );
  let laag1Text;
  if (behandelingAl.length > 0) {
    laag1Text = `Je bent al actief op zoek naar - of krijgt al - verlichting, ondersteuning of behandeling. Goed dat je die stap zet. Het kan waardevol zijn om ook te kijken naar de lagen eronder.`;
  } else if (klachten.some(k => k.includes('klachten') || k.includes('lichamelijk') || k.includes('Slaap') || k.includes('moe') || k.includes('spanning'))) {
    laag1Text = `Er spelen klachten die aandacht vragen. Het kan helpen om die te bespreken met een arts of therapeut. Daarnaast kan het waardevol zijn om te kijken naar het bredere plaatje.`;
  } else {
    laag1Text = `Op dit moment lijkt behandeling van klachten niet de meest urgente laag voor jou. Zo kun je je aandacht richten op wat er wél speelt.`;
  }

  // ── Laag 2: leefstijl & zelfzorg ─────────────────────────────────────────
  const leefstijlAl = albezig.filter(a =>
    a.includes('voeding') || a.includes('beweging') || a.includes('ontspanning') ||
    a.includes('slaap') || a.includes('zingeving')
  );
  const aandachtspunten = [];
  if (energie    <= 4) aandachtspunten.push('energiemanagement');
  if (slaap      <= 4) aandachtspunten.push('slaap');
  if (stress     <= 4) aandachtspunten.push('ontspanning & stressregulatie');
  if (voeding    <= 4) aandachtspunten.push('voeding');
  if (beweging   <= 4) aandachtspunten.push('beweging');
  if (verbinding <= 4) aandachtspunten.push('verbinding met jezelf');
  if (verbinding_anderen <= 4) aandachtspunten.push('verbinding met anderen');
  if (zingeving  <= 4) aandachtspunten.push('zoeken naar zingeving');

  let laag2Text;
  if (leefstijlAl.length > 0) {
    laag2Text = `Je bent al bezig met je leefstijl - dat is een goede basis.`;
    if (aandachtspunten.length > 0) {
      laag2Text += ` Wat mogelijk nog om aandacht vraagt: ${joinNl(aandachtspunten)}.`;
    } else {
      laag2Text += ` Misschien is er nog wat te optimaliseren.`;
    }
  } else {
    laag2Text = `Een gezonde basis - aandacht voor voeding, beweging, slaap, ontspanning, verbinding en zingeving - kan bijdragen aan vermindering van je klachten.`;
    if (aandachtspunten.length > 0) laag2Text += ` Op basis van wat jij aangaf, zijn dit de thema's die aandacht verdienen: ${joinNl(aandachtspunten)}.`;
  }

  // ── Laag 3: de Backpack - opgebouwd uit slides 6, 7 en 8 ─────────────────
  const patronenHerkend    = patronen.includes('herkenbaar') || patronen.includes('Soms wel');
  const patronenOpenStaand = patronen.includes('verkennen') || patronen.includes('onderzoeken') || patronen.includes('stilgestaan');
  const patronenNiet       = patronen.includes('Niet echt');
  const heeftPatronenTekst = patronenOpen.length > 2;

  const familieVerbanden   = familie.includes('verbanden');
  const familieVermoeden   = familie.includes('vermoed');
  const familieWilMaar     = familie.includes('spannend');
  const familieWilVerkennen = familie.includes('onderzoeken');
  const familieNiet        = familie.includes('Nee');

  const laag3Zinnen = [];

  // Zinnen 1+2 - slides 6 & 7: patronen, samengevoegd tot één vloeiende zin
  if (patronenHerkend) {
    if (heeftPatronenTekst) {
      laag3Zinnen.push(`Je herkent terugkerende patronen en thema's in je leven - zoals jij het zelf omschreef: <em>"${patronenOpen}"</em>.`);
    } else {
      laag3Zinnen.push(`Je herkent terugkerende patronen en thema's in je leven.`);
    }
  } else if (patronenOpenStaand) {
    if (heeftPatronenTekst) {
      laag3Zinnen.push(`Je hebt er nog niet volledig bij stilgestaan, maar je staat open voor de vraag of er terugkerende patronen of thema's spelen - iets als: <em>"${patronenOpen}"</em>.`);
    } else {
      laag3Zinnen.push(`Je hebt er nog niet volledig bij stilgestaan, maar je staat open voor de vraag of er terugkerende patronen of thema's spelen.`);
    }
  } else if (patronenNiet) {
    laag3Zinnen.push(`Op dit moment herken je terugkerende patronen of thema's niet zo sterk voor jezelf.`);
    if (heeftPatronenTekst) laag3Zinnen.push(`Toch omschreef je: <em>"${patronenOpen}"</em>.`);
  } else {
    laag3Zinnen.push(`Of er terugkerende patronen of thema's spelen, is voor jou nog een open vraag.`);
    if (heeftPatronenTekst) laag3Zinnen.push(`Wat jij omschreef: <em>"${patronenOpen}"</em>.`);
  }

  // Zin 3 - slide 8: koppeling met verleden & familiesysteem
  if (familieVerbanden) {
    laag3Zinnen.push(`Je ziet duidelijke verbanden met ervaringen uit je verleden of familiesysteem.`);
  } else if (familieVermoeden) {
    laag3Zinnen.push(`Je vermoedt dat ervaringen uit je verleden of familiesysteem een rol spelen, al is het beeld nog niet volledig helder.`);
  } else if (familieWilMaar) {
    laag3Zinnen.push(`Je wil er wel naar kijken - naar de rol van je verleden of familiesysteem - maar het voelt ook spannend.`);
  } else if (familieWilVerkennen) {
    laag3Zinnen.push(`Je hebt nog geen idee of ervaringen uit je verleden of je familiesysteem een rol spelen. Maar je staat open om dit te onderzoeken.`);
  } else if (familieNiet) {
    laag3Zinnen.push(`Op dit moment zie je geen directe koppeling met ervaringen uit je verleden of familiesysteem.`);
  }

  // Zin 4 - wens / volgende stap
  if (familieVerbanden || familieVermoeden || patronenHerkend) {
    laag3Zinnen.push(`Of je onverwerkte ervaringen met je meedraagt, deze wilt verkennen, begrijpen en verwerken, is iets om bij stil te staan.`);
  } else if (familieNiet && patronenNiet) {
    laag3Zinnen.push(`Het is goed om te weten dat de mogelijkheid dit te onderzoeken, er altijd is.`);
  }

  // Altijd afsluiten met: alles op zijn tijd
  laag3Zinnen.push(`Alles op zijn tijd.`);

  const laag3Text = laag3Zinnen.join(' ');

  // ── Brug: droom (slide 10) + behoefte als alinea (slide 9) ──────────────
  const heeftBehoefte = behoefte.length > 0;
  const heeftDroom    = droom.length > 2;
  let brugHTML = '';
  if (heeftBehoefte || heeftDroom) {
    let brugContent = '';
    if (heeftDroom) {
      brugContent += `<div style="margin-bottom:${heeftBehoefte ? '14px' : '0'}">
        <div class="layer-result-text" style="font-style:italic;">"${droom}"</div>
      </div>`;
    }
    if (heeftBehoefte) {
      const behoefteMap = {
        'Iemand die echt luistert, zonder oordeel':    { label: 'iemand die echt luistert, zonder oordeel', prio: 1 },
        'Concrete handvatten en praktische tips':       { label: 'concrete handvatten en praktische tips', prio: 1 },
        'De kern zien - begrijpen wat er écht speelt':  { label: 'inzicht in wat er écht speelt', prio: 1 },
        'Rust en een stap terug kunnen zetten':         { label: 'rust en de ruimte om een stap terug te zetten', prio: 2 },
        'Meer ruimte om te voelen':                     { label: 'meer ruimte om te voelen', prio: 2 },
        'Begeleiding om patronen te doorbreken':        { label: 'begeleiding bij het doorbreken van patronen', prio: 1 },
        'Verwerken van onverwerkte ervaringen':         { label: 'ruimte om onverwerkte ervaringen te verwerken', prio: 1 },
        'Inzicht krijgen in mijn familiesysteem':       { label: 'inzicht in je familiesysteem', prio: 1 },
        'Gewoon weten waar ik moet beginnen':           { label: 'helderheid over waar te beginnen', prio: 2 }
      };
      function nl(arr) { return arr.length < 2 ? (arr[0]||'') : arr.slice(0,-1).join(', ') + ' en ' + arr[arr.length-1]; }
      const primair   = behoefte.filter(b => (behoefteMap[b]||{prio:1}).prio === 1).map(b => (behoefteMap[b]||{label:b.toLowerCase()}).label);
      const secundair = behoefte.filter(b => (behoefteMap[b]||{prio:1}).prio === 2).map(b => (behoefteMap[b]||{label:b.toLowerCase()}).label);

      let alinea = '';
      if (primair.length === 1) {
        alinea = `Wat jij nu nodig hebt is ${primair[0]}.`;
      } else if (primair.length > 1) {
        alinea = `Wat jij nu nodig hebt zijn ${nl(primair)}.`;
      }
      if (secundair.length === 1) {
        alinea += ` Daarnaast zou ${secundair[0]} kunnen bijdragen.`;
      } else if (secundair.length > 1) {
        alinea += ` Daarnaast zouden ${nl(secundair)} kunnen bijdragen.`;
      }
      if (!alinea) {
        // alle antwoorden zijn secundair - behandel ze dan als primair
        const all = behoefte.map(b => (behoefteMap[b]||{label:b.toLowerCase()}).label);
        alinea = all.length === 1 ? `Wat jij nu nodig hebt is ${all[0]}.` : `Wat jij nu nodig hebt zijn ${nl(all)}.`;
      }
      brugContent += `<div>
        <div class="layer-result-sublabel" style="margin-bottom:6px;">wat jij nu nodig hebt</div>
        <div class="layer-result-text">${alinea}</div>
      </div>`;
    }
    brugHTML = `
      <div class="layer-result-card" style="border-left-color:#B5794F; --kc:#B5794F; margin-top:8px; margin-bottom:4px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <div class="layer-result-num" style="background:#B5794F">Jouw stip op de horizon</div>
        </div>
        ${brugContent}
      </div>`;
  }

  // ── Render kaarten ────────────────────────────────────────────────────────
  const cards = `
    ${klachtHTML}
    <div class="layer-result-card" style="border-left-color:#7C9A8B; --kc:#7C9A8B">
      <div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:6px;">
        <div class="layer-result-num" style="background:#7C9A8B;flex-shrink:0;white-space:nowrap;">Laag 1</div>
        <div class="layer-result-label">Symptomen verlichten & behandelen</div>
      </div>
      <div class="layer-result-sublabel">boven water</div>
      <div class="layer-result-text">${laag1Text}</div>
    </div>
    <div class="layer-result-card" style="border-left-color:#5F6D66; --kc:#5F6D66">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <div class="layer-result-num" style="background:#5F6D66">Laag 2</div>
        <div class="layer-result-label">Leefstijl & zelfzorg</div>
      </div>
      <div class="layer-result-sublabel">boven water</div>
      <div class="layer-result-text">${laag2Text}</div>
    </div>
    <div class="waterlijn" aria-hidden="true"></div>
    <div class="layer-result-card" style="border-left-color:#24433A; --kc:#24433A">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <div class="layer-result-num" style="background:#24433A">Laag 3</div>
        <div class="layer-result-label">Jouw Backpack</div>
      </div>
      <div class="layer-result-sublabel">onder de oppervlakte</div>
      <div class="layer-result-text">${laag3Text}</div>
    </div>
    ${brugHTML}
    <div class="pdf-row">
      <button type="button" class="btn-pdf" onclick="bewaarAlsPDF()">Bewaar je reflectie als PDF</button>
    </div>
    <div class="zelf-card">
      <div class="zelf-label">Zelf aan de slag</div>
      <div class="zelf-title">Breng je familiesysteem in kaart</div>
      <p class="zelf-text">Wil je alvast zelf op ontdekking? In het werkboek <em>Unpack your story</em> en met de digitale tool <em>My Backpack</em> haal je de verhalen uit je familie op door vragen te beantwoorden over jezelf, je ouders en hun families. In je eigen tempo.</p>
      <a class="btn-zelf" href="https://www.mybackpack.nl/werkboek" target="_blank" rel="noopener">Bekijk het werkboek en de digitale tool →</a>
    </div>`;

  // ── CTA tekst ─────────────────────────────────────────────────────────────
  const ctaText = `Wil je samen aan de slag met je leefstijl of Backpack? Jij voelt wat passend is voor dit moment. Clementine helpt je graag verder!`;

  // ── Render ────────────────────────────────────────────────────────────────
  const output = document.getElementById('reflection-output');
  const ctaBlock = document.getElementById('cta-block');
  const ctaPersonal = document.getElementById('cta-personal-text');

  output.style.opacity = '0';
  output.innerHTML = cards;
  if (ctaPersonal) ctaPersonal.textContent = ctaText;

  setTimeout(() => {
    output.style.transition = 'opacity 0.6s ease';
    output.style.opacity = '1';
    ctaBlock.style.display = 'block';
    setTimeout(() => ctaBlock.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 500);
  }, 300);
}
render();
</script>
</body>
</html>
