# Instellingen voor Netlify. Dit bestand hoort in de hoofdmap van de repository.

[build]
  # Netlify draait dit commando bij elke wijziging en bouwt de pagina's opnieuw.
  command = "python3 build.py"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"

# ------------------------------------------------------------
#  DOORVERWIJZINGEN VAN DE OUDE NAAR DE NIEUWE ADRESSEN
#  Zonder deze regels verliest de site de posities die er nu al zijn,
#  en komen bezoekers via oude links op een foutmelding.
# ------------------------------------------------------------

